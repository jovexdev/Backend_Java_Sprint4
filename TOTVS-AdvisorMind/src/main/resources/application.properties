spring.application.name=TOTVS-AdvisorMind
spring.profiles.default=local
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.accept-float-as-int=false
advisormind.openai-key=${OPENAI_API_KEY:}
advisormind.openai-model=${OPENAI_MODEL:gpt-4o-mini}
advisormind.openai-endpoint=https://api.openai.com/v1/chat/completions
advisormind.openai-timeout-seconds=45
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.mapper.allow-coercion-of-scalars=false
